  requirements:
    _access: 'TRUE'
  methods: [POST]

# Réglages IA — même schéma que order_local/list (priorité sur le catch-all api_solutions).
mz_eroso_v2.api.ai_settings.get:
  path: '/api_solutions/api/v2/mz_eroso/ai_settings/list'
