mz_eroso_v2.stock_stats:
  path: '/api/v2/stock/stats'
  defaults:
    _controller: '\Drupal\mz_eroso_v2\Controller\StockStatsController::getStats'
  requirements:
    _permission: 'access content'
  methods: [GET]

mz_eroso_v2.stock_entries:
  path: '/api/v2/stock/entries'
  defaults:
    _controller: '\Drupal\mz_eroso_v2\Controller\StockStatsController::getEntries'
  requirements:
    _permission: 'access content'
  methods: [GET]

mz_eroso_v2.stock_exits:
  path: '/api/v2/stock/exits'
  defaults:
    _controller: '\Drupal\mz_eroso_v2\Controller\StockStatsController::getExits'
  requirements:
    _permission: 'access content'
  methods: [GET]

mz_eroso_v2.save_order_local:
  path: '/api/v2/order-local/save'
  defaults:
    _controller: '\Drupal\mz_eroso_v2\Controller\OrderLocalController::saveOrderLocal'
  requirements:
    _access: 'TRUE'
  methods: [POST]

mz_eroso_v2.cancel_order_local:
  path: '/api/v2/order-local/cancel'
  defaults:
    _controller: '\Drupal\mz_eroso_v2\Controller\OrderLocalController::cancelOrderLocal'
  requirements:
    _access: 'TRUE'
  methods: [POST]

mz_eroso_v2.update_status_local:
  path: '/api/v2/order-local/update-status'
  defaults:
    _controller: '\Drupal\mz_eroso_v2\Controller\OrderLocalController::updateStatusLocal'
  requirements:
    _access: 'TRUE'

mz_eroso_v2.update_cart_price_local:
  path: '/api/v2/order-local/update-cart-price'
  defaults:
    _controller: '\Drupal\mz_eroso_v2\Controller\OrderLocalController::updateCartPrice'
  requirements:
    _access: 'TRUE'
  methods: [POST]

mz_eroso_v2.save_order_commande:
  path: '/api/v2/order-commande/save'
  defaults:
    _controller: '\Drupal\mz_eroso_v2\Controller\OrderLocalController::saveOrderCommande'
  requirements:
    _access: 'TRUE'
  methods: [POST]

# ≥3 segments after /api/v2/ — évite simple_json_api /api/v2/{entitype}/{bundle} (2 segments).
mz_eroso_v2.api.order_commande.list:
  path: '/api/v2/mz_eroso/order_commande/list'
  defaults:
    _controller: '\Drupal\mz_eroso_v2\Controller\OrderCommandeApiController::list'
  requirements:
    _permission: 'access content'
  methods: [GET]

# Même handler que les autres appels axios (getLists, getOrderLocalList).
mz_eroso_v2.api.order_commande.list_api_solutions:
  path: '/api_solutions/api/v2/mz_eroso/order_commande/list'
  defaults:
    _controller: '\Drupal\mz_eroso_v2\Controller\OrderCommandeApiController::list'
  requirements:
    _permission: 'access content'
  methods: [GET]
