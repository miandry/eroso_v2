  defaults:
    _controller: '\Drupal\mz_eroso_v2\Controller\OrderLocalApiController::list'
  requirements:
    _permission: 'access content'
  methods: [GET]

# Catalogue public — produits disponibles sans authentification.
mz_eroso_v2.api.public_products.list:
  path: '/api_solutions/api/v2/mz_eroso/public_products/list'
  defaults:
    _controller: '\Drupal\mz_eroso_v2\Controller\PublicProductApiController::list'
  requirements:
    _access: 'TRUE'
  methods: [GET]

mz_eroso_v2.api.public_products.view:
  path: '/api_solutions/api/v2/mz_eroso/public_products/view/{nid}'
  defaults:
    _controller: '\Drupal\mz_eroso_v2\Controller\PublicProductApiController::view'
  requirements:
    _access: 'TRUE'
    nid: '\d+'
  methods: [GET]

mz_eroso_v2.api.public_products.categories:
  path: '/api_solutions/api/v2/mz_eroso/public_products/categories'
  defaults:
