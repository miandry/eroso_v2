services:
  logger.channel.mz_claude_api:
    parent: logger.channel_base
    arguments: ['mz_claude_api']

  mz_claude_api.client:
    class: Drupal\mz_claude_api\Service\ClaudeApiClient
    arguments: ['@http_client', '@config.factory', '@logger.channel.mz_claude_api']

  mz_claude_api.product_image_analyzer:
    class: Drupal\mz_claude_api\Service\ProductImageAnalyzer
    arguments: ['@mz_claude_api.client']

  mz_claude_api.product_image_matcher:
    class: Drupal\mz_claude_api\Service\ProductImageMatcher
    arguments:
      - '@mz_claude_api.client'
      - '@mz_claude_api.product_image_analyzer'
      - '@entity_type.manager'
      - '@file_system'
      - '@config.factory'
