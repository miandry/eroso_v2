mz_claude_api.product.search_by_image:
  path: '/api/v2/product/search-by-image'
  defaults:
    _controller: '\Drupal\mz_claude_api\Controller\ProductImageSearchController::search'
  requirements:
    _access: 'TRUE'
  methods: [POST]

mz_claude_api.product.search_by_image_api_solutions:
  path: '/api_solutions/api/v2/product/search-by-image'
  defaults:
    _controller: '\Drupal\mz_claude_api\Controller\ProductImageSearchController::search'
  requirements:
    _access: 'TRUE'
  methods: [POST]

mz_claude_api.product.analyze_image_for_search:
  path: '/api/v2/product/analyze-image-for-search'
  defaults:
    _controller: '\Drupal\mz_claude_api\Controller\ProductImageSearchController::analyzeForSearch'
  requirements:
    _access: 'TRUE'
  methods: [POST]

mz_claude_api.product.analyze_image_for_search_api_solutions:
  path: '/api_solutions/api/v2/product/analyze-image-for-search'
  defaults:
    _controller: '\Drupal\mz_claude_api\Controller\ProductImageSearchController::analyzeForSearch'
  requirements:
    _access: 'TRUE'
  methods: [POST]

mz_claude_api.product.generate_search_image:
  path: '/api/v2/product/{nid}/generate-search-image'
  defaults:
    _controller: '\Drupal\mz_claude_api\Controller\ProductImageSearchController::generateForProduct'
  requirements:
    _access: 'TRUE'
    nid: '\d+'
  methods: [POST]

mz_claude_api.product.generate_search_image_api_solutions:
  path: '/api_solutions/api/v2/product/{nid}/generate-search-image'
  defaults:
    _controller: '\Drupal\mz_claude_api\Controller\ProductImageSearchController::generateForProduct'
  requirements:
    _access: 'TRUE'
    nid: '\d+'
  methods: [POST]
